# QA-08: the MVP E2E demo (Playwright) against the full local stack.
# Separate from ci.yml: it needs a browser download and the built frontend.
name: e2e

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: localetl
          POSTGRES_PASSWORD: localetl
          POSTGRES_DB: localetl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U localetl -d localetl"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      DATABASE_URL: postgresql+psycopg://localetl:localetl@127.0.0.1:5432/localetl

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tests/e2e/package-lock.json

      - run: python -m pip install -e 'backend[dev]'
      - run: npm --prefix frontend ci
      - run: npm --prefix tests/e2e ci
      - run: npx playwright install --with-deps chromium
        working-directory: tests/e2e

      - name: Run the demo (scripts/e2e.sh starts and stops the whole stack)
        run: PYTHON=python scripts/e2e.sh

      - name: Upload video, trace and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            tests/e2e/test-results
            tests/e2e/playwright-report
          retention-days: 7
