# CI (QA-04). The single source of truth is scripts/test-all.sh, so CI == local:
#   contract check, Redocly lint, ruff (backend + tests), mypy (+ --strict app/etl), backend pytest,
#   fixtures, API conformance, frontend test/lint/typecheck/build, generated-types drift.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          # The role must be able to CREATE DATABASE (F9): the model, ETL and API suites create
          # throwaway databases. The image's bootstrap superuser can.
          POSTGRES_USER: localetl
          POSTGRES_PASSWORD: localetl
          POSTGRES_DB: localetl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U localetl -d localetl"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      DATABASE_URL: postgresql+psycopg://localetl:localetl@127.0.0.1:5432/localetl
      TEST_DATABASE_URL: postgresql+psycopg://localetl:localetl@127.0.0.1:5432/localetl_test
      PGPASSWORD: localetl

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend (the only supported way)
        run: python -m pip install -e 'backend[dev]'

      - name: Create the test database
        # scripts/db/init.sql does this for the compose stack; a CI service container cannot mount it.
        run: psql -h 127.0.0.1 -U localetl -d localetl -c "CREATE DATABASE localetl_test"

      - name: Run every check (scripts/test-all.sh)
        run: scripts/test-all.sh
