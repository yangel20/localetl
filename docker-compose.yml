# Local dev stack: PostgreSQL 16 only (API, worker and frontend run on the host).
# Values come from .env (copy .env.example); defaults match .env.example.
# The project name is pinned so every checkout and worktree addresses the same stack;
# COMPOSE_PROJECT_NAME (or -p) still overrides it, e.g. for a throwaway review stack.
name: localetl
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-localetl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localetl}
      POSTGRES_DB: ${POSTGRES_DB:-localetl}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - localetl_pgdata:/var/lib/postgresql/data
      # Runs only on first initialisation of an empty volume.
      - ./scripts/db/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      # -h 127.0.0.1 checks the TCP listener (not only the init-time unix socket), so "healthy"
      # means clients on the published port can connect.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  localetl_pgdata:
