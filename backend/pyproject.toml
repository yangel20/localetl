[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localetl"
version = "0.1.0"
description = "LocalETL: local-first CSV to PostgreSQL ETL (API, ETL engine, worker)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.1,<4",
    "alembic>=1.13,<2",
    "pandas>=2.2,<3",
    "jsonschema>=4.21,<5",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "mypy>=1.10,<2",
    "ruff>=0.5",
    "httpx>=0.27,<1",
    "pandas-stubs>=2.2",
    # Contract tooling and the API conformance harness (QA-05, F10):
    # PyYAML loads contracts/openapi.yaml; openapi-spec-validator backs
    # contracts/tools/check_contracts.py. Test-only, never imported by app.
    "pyyaml>=6,<7",
    "openapi-spec-validator>=0.7,<0.10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: tests that need PostgreSQL at TEST_DATABASE_URL"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["app.etl", "app.etl.*"]
strict = true

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# Classify `app` as first-party wherever ruff is invoked from (backend/ or the
# repo root, e.g. for tests/integration), so import order is deterministic.
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form"]
